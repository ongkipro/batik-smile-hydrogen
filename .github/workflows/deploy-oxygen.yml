name: Deploy to Oxygen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Oxygen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --allow-remote=all

      - name: Deploy to Shopify Oxygen
        run: npx shopify hydrogen deploy --shop 23ahbp-sq.myshopify.com --no-verify
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN }}
          PUBLIC_STORE_DOMAIN: ${{ vars.PUBLIC_STORE_DOMAIN || '23ahbp-sq.myshopify.com' }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          PRIVATE_STOREFRONT_API_TOKEN: ${{ secrets.PRIVATE_STOREFRONT_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
